# Pre-commit hooks (Kryten ecosystem).
#
# Runs safe auto-fixers (ruff --fix, black) and a secret scan (gitleaks) before each
# commit. ruff/black apply fixes and abort the commit so you re-stage and commit again.
# ruff and black run via `uv run` so they use THIS repo's exact locked versions — the same
# ones CI uses — avoiding formatter/linter drift between local commits and CI.
#
# One-time setup per clone:
#   1. uv sync                         # create the project env (ruff/black live here)
#   2. Install the gitleaks binary:    winget install Gitleaks.Gitleaks   (macOS: brew install gitleaks)
#   3. pipx install pre-commit         # or: pip install pre-commit
#   4. pre-commit install
#
# Manual run:  pre-commit run --all-files
# Config: ruff/black read pyproject.toml; gitleaks reads .gitleaks.toml.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + safe autofix)
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: black
        name: black (format)
        entry: uv run --no-sync black
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: gitleaks
        name: gitleaks (secret scan)
        description: Block commits that introduce secrets.
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
